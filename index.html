<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Research Map: LLM for EKM Scheduling</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #111; color: #eee; display: flex; height: 100vh; }
    #graph { flex: 3; height: 100%; }
    #panel { flex: 1; padding: 1.5rem; background: #1a1a1a; border-left: 2px solid #333; overflow-y: auto; }
    #panel h2 { color: #4fc3f7; margin-top: 0; font-size: 1.05rem; line-height: 1.4; }
    #panel .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-bottom: 0.5rem; }
    .tag.forecast { background: #1565c0; }
    .tag.schedule { background: #2e7d32; }
    .tag.llm { background: #ef6c00; }
    .tag.core { background: #c62828; }
    #panel a { color: #4fc3f7; }
    #panel .meta { color: #aaa; font-size: 0.85rem; margin-bottom: 0.75rem; }
    #panel .block { margin-bottom: 0.9rem; }
    #panel .block strong { color: #4fc3f7; display: block; margin-bottom: 0.2rem; }
    .hint { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <div id="graph"></div>
  <div id="panel">
    <h2>Research Map</h2>
    <p class="hint">Click any node to see details.</p>
  </div>

  <script>
    const nodesData = [
      {
        id: 1,
        label: "Guo et al. (2026)\nASTGCN + EKM\n[DOMAIN CORE]",
        group: "core",
        authors: "Yuhan Guo, Hongao Wang, Haoran Wang, Hamid Allaoui, Youssef Boulaksil, Wenhua Li",
        year: 2025,
        title: "Forecast-guided multi-task scheduling for autonomous electric ride-hailing fleets under charging and maintenance constraints",
        venue: "Expert Systems with Applications, 334, Article 134759",
        abstract: "Autonomous electric ride-hailing fleets require real-time coordination among passenger dispatching, proactive repositioning, charging, and maintenance. This paper proposes a forecast-guided rolling framework that combines an attention-based spatial-temporal graph convolutional network (ASTGCN) with Enhanced Kuhn-Munkres (EKM) multi-task assignment. ASTGCN predicts grid-level demand, while a virtual-node (VN) mechanism converts forecasted regional shortages into bounded point-level relocation tasks at feasible points of interest (POIs). Passenger orders, VN-based repositioning, charging, and maintenance are then coordinated in a common vehicle-task graph after infeasible vehicle-task pairs are filtered according to battery, health, time-window, charging-capacity, and maintenance-capacity constraints. A residual-based search mechanism reduces the computational burden introduced by graph expansion. Experiments using real-world ride-hailing data show that the proposed framework achieves a system matching rate of 79.76%, which is 5.52 percentage points higher than the classical Kuhn-Munkres matching baseline. It reduces average passenger waiting time to 6.68 min, corresponding to a 14.41% reduction compared with the non-predictive scheduling variant. It also improves spatial supply-demand balance, reducing the normalized demand-supply difference to 0.128, and completes each rolling scheduling decision within 1.42 s on average. The incremental ablation study further shows that virtual-node-based forecast conversion mainly improves service quality and spatial balance, while the residual-based search mechanism reduces computation time from 22.45 s to 1.42 s without observed degradation. These results indicate that the main value of the proposed framework lies in converting demand forecasts into executable multi-task assignments for real-time autonomous electric fleet operation.",
        pros: "Integrates four task types (passenger, repositioning, charging, maintenance) in one rolling assignment. Achieves 79.76% matching rate and 1.42 s per decision. Provides a complete feasibility structure for AEV fleets.",
        cons: "The MMRSM search heuristic is manually designed and its pruning is not guaranteed to be exact. The authors themselves state that theoretical exactness is not assumed. This is the main limitation.",
        usefulness: "This is the host pipeline. I will keep EKM, ASTGCN, feasibility rules, and VN generation unchanged, and replace only the manually designed search heuristic with an LLM-generated one.",
        connection: "Connected to IKM (no. 2) as predecessor, ASTGCN (no. 4) as forecast input, ALNS (no. 3) as alternative heuristic, and LLM-AAD (no. 10) as the method that will fill the gap.",
        link: "https://doi.org/10.1016/j.eswa.2026.134759"
      },
      {
        id: 2,
        label: "Guo et al. (2024)\nIKM",
        group: "schedule",
        authors: "Yuhan Guo, Wenhua Li, L. Xiao, Hamid Allaoui",
        year: 2024,
        title: "A prediction-based iterative Kuhn-Munkres approach for service vehicle reallocation in ride-hailing",
        venue: "International Journal of Production Research, 62(10), 3690–3715",
        abstract: "Proposes an iterative Kuhn-Munkres (KM) approach that uses demand predictions to reallocate service vehicles in ride-hailing systems. The method iteratively refines vehicle-to-task matching by incorporating predicted regional demand, and is shown to outperform static or purely reactive matching baselines. This paper is the direct predecessor of the EKM pipeline in Guo et al. (2025).",
        pros: "Establishes the iterative KM baseline for ride-hailing reallocation. Uses demand prediction to guide matching.",
        cons: "No LLM component, no forecast-to-task conversion, no multi-task feasibility structure.",
        usefulness: "Shows the evolution of the matching method I will modify. Helps me explain why EKM in 2025 is a natural next step.",
        connection: "Direct predecessor of Guo et al. (2026). Connected by a 'predecessor' edge.",
        link: "https://doi.org/10.1080/00207543.2023.2247092"
      },
      {
        id: 3,
        label: "Ropke & Pisinger (2006)\nALNS",
        group: "schedule",
        authors: "Stefan Ropke, David Pisinger",
        year: 2006,
        title: "An Adaptive Large Neighborhood Search Heuristic for the Pickup and Delivery Problem with Time Windows",
        venue: "Transportation Science, 40(4), 455–472",
        abstract: "Introduces an adaptive large neighborhood search (ALNS) heuristic for the pickup and delivery problem with time windows (PDPTW). The method iteratively destroys and repairs solutions using a pool of operators whose selection probabilities adapt based on their past performance. ALNS is a classical manual heuristic design and serves as a non-RL comparison for search-operator design in scheduling.",
        pros: "Flexible heuristic framework. Operator selection adapts based on past performance. Widely used in VRP literature.",
        cons: "Operators are manually designed. No LLM generation. Not specific to AEV multi-task scheduling.",
        usefulness: "Shows that heuristic search operators in scheduling are still manually designed, which is exactly what my LLM loop replaces. Also a non-RL comparison point.",
        connection: "Connected to Guo et al. (2026) as an 'alternative heuristic' for search-operator design.",
        link: "https://doi.org/10.1287/trsc.1050.0135"
      },
      {
        id: 4,
        label: "Guo et al. (2019)\nASTGCN",
        group: "forecast",
        authors: "Shengnan Guo, Youfang Lin, Ning Feng, Chao Song, Huaiyu Wan",
        year: 2019,
        title: "Attention based spatial-temporal graph convolutional networks for traffic flow forecasting",
        venue: "Proceedings of the AAAI Conference on Artificial Intelligence, 33(01), 922–929",
        abstract: "Proposes ASTGCN, a deep learning model that combines spatial graph convolution, temporal convolution, and dual attention mechanisms to forecast traffic flow. Spatial attention captures time-varying correlations between road segments, while temporal attention reweights historical observations. This is the forecasting backbone used in the scheduling pipeline above.",
        pros: "Dual attention mechanism handles non-stationary demand. Captures both spatial and temporal dependencies.",
        cons: "Standalone forecasting; does not produce executable tasks. Output is aggregate demand, not vehicle-level decisions.",
        usefulness: "The forecasting module I keep unchanged. I only need to understand its output format to work on the search heuristic downstream.",
        connection: "Connected to Guo et al. (2026) as 'forecast input'. Also connected to STGAT (no. 5) as alternative and Manibardo (no. 6) as critique.",
        link: "https://doi.org/10.1609/aaai.v33i01.3301922"
      },
      {
        id: 5,
        label: "Zhang et al. (2023)\nSTGAT",
        group: "forecast",
        authors: "T. Y. Zhang, Y. B. Wang, Z. C. Wei",
        year: 2023,
        title: "STGAT: A Spatio-Temporal Graph Attention Network for Travel Demand Prediction",
        venue: "2023 International Conference on Networking and Network Applications (NaNA), pp. 434–439",
        abstract: "Proposes STGAT, a graph attention network for travel demand prediction that models spatial dependencies between urban regions and temporal patterns in demand. It is an alternative to ASTGCN for the forecasting module, and illustrates that several graph-attention architectures exist for grid-level demand prediction.",
        pros: "Alternative graph attention architecture. Shows the forecasting cluster is active and diverse.",
        cons: "Output is aggregate demand, not vehicle-level tasks. Not integrated with scheduling.",
        usefulness: "Comparison point for the forecasting cluster. Helps me argue that forecasting is mature and the real gap is in assignment, not prediction.",
        connection: "Connected to ASTGCN (no. 4) as an alternative forecasting model.",
        link: "https://doi.org/10.1109/NaNA60121.2023.00078"
      },
      {
        id: 6,
        label: "Manibardo et al. (2022)\nDL Review",
        group: "forecast",
        authors: "Eric L. Manibardo, Ibai Laña, Javier Del Ser",
        year: 2022,
        title: "Deep learning for road traffic forecasting: Does it make a difference?",
        venue: "IEEE Transactions on Intelligent Transportation Systems, 23(7), 6164–6188",
        abstract: "A critical review that empirically compares deep learning models against simpler statistical and machine learning baselines for road traffic forecasting. The authors question whether deep learning always provides meaningful improvements, and highlight cases where simpler models perform comparably. This paper supports the argument that forecast accuracy alone is not sufficient, and that the integration of forecasts into downstream decisions matters more.",
        pros: "Critical perspective. Supports the argument that forecast accuracy alone is not enough.",
        cons: "Review, not a method. Does not propose a new forecasting model.",
        usefulness: "Justifies focusing on prediction-to-assignment integration rather than forecast accuracy. Strengthens my motivation for working on the search heuristic rather than the forecasting model.",
        connection: "Connected to ASTGCN (no. 4) as a 'critique' of forecasting-centric approaches.",
        link: "https://doi.org/10.1109/TITS.2021.3083957"
      },
      {
        id: 7,
        label: "Romera-Paredes et al. (2024)\nFunSearch",
        group: "llm",
        authors: "Bernardino Romera-Paredes, Mohammadamin Barekatain, Alexander Novikov, Matej Balog, M. Pawan Kumar, Emilien Dupont, Francisco J. R. Ruiz, Jordan S. Ellenberg, Pengming Wang, Omar Fawzi, et al.",
        year: 2024,
        title: "Mathematical discoveries from program search with large language models",
        venue: "Nature, 625(7995), 468–475",
        abstract: "Introduces FunSearch, a method that pairs a pretrained large language model with a systematic evaluator to search for programs rather than solutions. The LLM proposes candidate programs, the evaluator scores them, and the best candidates are fed back to the LLM for refinement. FunSearch discovers new mathematical constructions, and establishes the generate–evaluate–evolve paradigm that later LLM-based algorithm design methods build on.",
        pros: "Proves LLM can generate evaluable code. Establishes the generate-evaluate-evolve paradigm.",
        cons: "Focused on math/combinatorics, not fleet scheduling with physical constraints.",
        usefulness: "Ancestor of the generate-evaluate-evolve loop I will use. Gives me the conceptual foundation.",
        connection: "Connected to EoH (no. 8) as 'inspires'. Indirectly connected to LLM-AAD (no. 10) through EoH.",
        link: ""
      },
      {
        id: 8,
        label: "Liu et al. (2024)\nEoH",
        group: "llm",
        authors: "Fei Liu, Tong Xialiang, Mingxuan Yuan, Xi Lin, Fu Luo, Zhenkun Wang, Zhichao Lu, Qingfu Zhang",
        year: 2024,
        title: "Evolution of heuristics: Towards efficient automatic algorithm design using large language model",
        venue: "Proceedings of the 41st International Conference on Machine Learning (ICML)",
        abstract: "Proposes Evolution of Heuristics (EoH), a framework that uses a large language model within an evolutionary loop to automatically design heuristics. The LLM generates and mutates heuristic code, and an evaluator scores the resulting heuristics on the target optimization problem. EoH shows that LLM-driven heuristic design can outperform manually designed heuristics on several combinatorial optimization benchmarks, and it is the closest methodological precedent for replacing a manually tuned module in a scheduling pipeline.",
        pros: "Direct methodological precedent. Shows LLM can design heuristics that outperform manual ones.",
        cons: "Not applied to ride-hailing scheduling. Evaluated on general combinatorial benchmarks.",
        usefulness: "Framework basis for my LLM loop. I can adapt its evolutionary structure to the search heuristic in EKM.",
        connection: "Connected to FunSearch (no. 7) as 'inspires' (incoming) and to LLM-AAD (no. 10) as 'extends' (outgoing). Also parallel to HSEvo (no. 9).",
        link: ""
      },
      {
        id: 9,
        label: "Dat et al. (2025)\nHSEvo",
        group: "llm",
        authors: "Pham Vu Tuan Dat, Long Doan, Huynh Thi Thanh Binh",
        year: 2025,
        title: "HSEvo: Elevating automatic heuristic design with diversity-driven harmony search and genetic algorithm using LLMs",
        venue: "Proceedings of the AAAI Conference on Artificial Intelligence, 39, 26931–26938",
        abstract: "Proposes HSEvo, a framework that combines large language models with harmony search and genetic algorithms to automatically design heuristics. The method emphasizes diversity in the generated heuristic population to avoid premature convergence. HSEvo is a parallel variant to EoH and demonstrates that multiple LLM + evolutionary computation designs exist, strengthening the methodological base for LLM-driven heuristic design.",
        pros: "Emphasizes diversity, avoids premature convergence. Shows multiple LLM+EC variants exist.",
        cons: "Domain is general optimization, not ride-hailing.",
        usefulness: "Alternative loop design if the basic LLM-AAD loop underperforms. Backup option for my experiments.",
        connection: "Connected to EoH (no. 8) as 'parallel variant'.",
        link: ""
      },
      {
        id: 10,
        label: "Wang et al. (2026)\nLLM-AAD\n[METHOD CORE]",
        group: "core",
        authors: "Yiyang Wang, Lanyue Zhang, Yuhan Guo, Lingxiao Wu",
        year: 2026,
        title: "Towards automated optimization algorithm design with LLM: An exploratory study in multi-objective weather routing",
        venue: "Transportation Research Part E: Logistics and Transportation Review, 210, Article 104786",
        abstract: "Weather routing plays a crucial role in enhancing navigation safety and economic efficiency. As a key component in weather routing systems, optimization algorithms have attracted considerable research attention. Currently, the design of such algorithms relies heavily on manual effort, with the primary goal of developing widely applicable and effective approaches. However, since factors such as sailing waters, seasonal conditions and ship status vary across voyages, optimization algorithms must be tailored to specific conditions of each voyage. Designing a dedicated algorithm for individual voyages is time-consuming, which is unsuitable for supporting autonomous route and speed planning. To address this limitation, this study introduces a novel framework for the automated design of optimization algorithms, with a focus on multi-objective weather routing problems. Specially, leveraging a large language model (LLM), the framework adaptively configures genetic algorithms (GAs) according to voyage-specific conditions. It automatically generates effective crossover and mutation operators without manual intervention, thereby producing high-quality Pareto solution sets. The proposed framework is evaluated using real-world case experiments. Results demonstrate that, compared to traditional manually designed GAs, the proposed framework can autonomously generate high-performance optimization algorithms tailored to specific voyages. The algorithms generated by the proposed framework achieve more diverse and higher-quality Pareto fronts (PFs) with improved computational efficiency.",
        pros: "Direct template for LLM-driven operator design. Proof-of-concept in another optimization domain. Generates case-specific operators without manual intervention.",
        cons: "Still only covers crossover/mutation, not the full algorithm. Domain is weather routing, not ride-hailing scheduling.",
        usefulness: "Direct template for my LLM loop design. I will adapt its generate-evaluate-evolve structure to the search heuristic in EKM.",
        connection: "Connected to EoH (no. 8) as 'extends'. Connected to Guo et al. (2026) by a dashed red 'GAP' edge: not yet applied to scheduling.",
        link: "https://doi.org/10.1016/j.tre.2026.104786"
      }
    ];

    const edgesData = [
      { from: 2, to: 1, label: "predecessor" },
      { from: 3, to: 1, label: "alternative heuristic" },
      { from: 4, to: 1, label: "forecast input" },
      { from: 5, to: 4, label: "alternative" },
      { from: 6, to: 4, label: "critique" },
      { from: 7, to: 8, label: "inspires" },
      { from: 8, to: 9, label: "parallel variant" },
      { from: 8, to: 10, label: "extends" },
      { from: 10, to: 1, label: "GAP: not yet applied", dashes: true, color: { color: "#ff5252" } }
    ];

    const groupColors = {
      forecast: { background: "#1565c0", border: "#0d47a1" },
      schedule: { background: "#2e7d32", border: "#1b5e20" },
      llm:      { background: "#ef6c00", border: "#e65100" },
      core:     { background: "#c62828", border: "#8e0000" }
    };

    const nodes = new vis.DataSet(nodesData.map(n => ({
      id: n.id,
      label: n.label,
      shape: "box",
      font: { color: "#fff", size: 13 },
      color: groupColors[n.group],
      margin: 12,
      borderWidth: n.group === "core" ? 4 : 2
    })));
    const edges = new vis.DataSet(edgesData);

    const container = document.getElementById("graph");
    const options = {
      edges: {
        font: { color: "#ccc", size: 11, align: "middle" },
        color: { color: "#666", highlight: "#4fc3f7" },
        smooth: { type: "continuous" },
        arrows: { to: { enabled: true, scaleFactor: 0.8 } }
      },
      physics: { enabled: true, barnesHut: { gravitationalConstant: -9000, springLength: 220 } },
      interaction: { hover: true, tooltipDelay: 100 }
    };
    const network = new vis.Network(container, { nodes, edges }, options);

    network.on("click", function (params) {
      const panel = document.getElementById("panel");
      if (params.nodes.length === 0) {
        panel.innerHTML = `<h2>Research Map</h2><p class="hint">Click any node to see details.</p>`;
        return;
      }
      const p = nodesData.find(n => n.id === params.nodes[0]);
      if (!p) return;
      panel.innerHTML = `
        <span class="tag ${p.group}">${p.group.toUpperCase()}</span>
        <h2>${p.title}</h2>
        <div class="meta">
          <strong>Authors:</strong> ${p.authors}<br>
          <strong>Year:</strong> ${p.year}<br>
          <strong>Venue:</strong> ${p.venue}
        </div>
        <div class="block"><strong>Abstract</strong>${p.abstract}</div>
        <div class="block"><strong>Pros</strong>${p.pros}</div>
        <div class="block"><strong>Cons</strong>${p.cons}</div>
        <div class="block"><strong>How it may be useful during next studies</strong>${p.usefulness}</div>
        <div class="block"><strong>Connection to other works</strong>${p.connection}</div>
        ${p.link ? `<p><a href="${p.link}" target="_blank">Open paper</a></p>` : ""}
      `;
    });
  </script>
</body>
</html>
